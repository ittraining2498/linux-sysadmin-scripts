name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on every shell script
        run: |
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*')
          printf 'Checking %d script(s)\n' "${#files[@]}"
          shellcheck --severity=warning "${files[@]}"

  syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

  runtime:
    name: Ubuntu container regression
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 procps passwd tar coreutils gawk
      - name: Exercise scripts in the disposable container
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tarfile, pwd, stat
          P=pathlib.Path
          root=P.cwd()
          passed=0

          def check(label, args, code=0, contains=None, env=None):
              global passed
              r=subprocess.run(args,text=True,capture_output=True,env=env)
              assert r.returncode==code,(label,r.returncode,r.stdout,r.stderr)
              if contains: assert contains in r.stdout+r.stderr,(label,r.stdout,r.stderr)
              passed+=1
              print('PASS',label, 'exit='+str(r.returncode))
              return r

          def script(name,*args,**kw):
              return check(name+' '+' '.join(args),['bash',str(root/name),*args],**kw)

          r=script('linux/bulk-delete-users.sh',code=2,contains='no accounts changed')
          assert 'Preview only:' in r.stderr and '#guide-delete' in r.stderr
          print('NO-ARGUMENT OUTPUT:\n'+r.stderr)
          P('/tmp/test.sh').write_text((root/'linux/bulk-delete-users.sh').read_text())
          check('renamed script guidance',['bash','/tmp/test.sh'],code=2,contains='sudo bash /tmp/test.sh alice')
          for name in ['linux/bulk-create-users.sh','linux/bulk-delete-users.sh','linux/check-disk.sh','proxmox/cluster-health.sh']:
              script(name,'--help',contains='Exit codes:')
              script(name,'--not-an-option',code=2,contains='unknown option')
          for name,opt in [('linux/bulk-create-users.sh','--file'),('linux/bulk-create-users.sh','--out'),('linux/bulk-create-users.sh','--shell'),('linux/bulk-delete-users.sh','--file'),('linux/bulk-delete-users.sh','--min-uid'),('linux/check-disk.sh','--warn'),('linux/check-disk.sh','--exclude'),('proxmox/cluster-health.sh','--warn')]:
              script(name,opt,code=2,contains='requires')
          for name in ['linux/check-disk.sh','proxmox/cluster-health.sh']:
              for value in ['abc','-1','101']:
                  script(name,'--warn',value,code=2,contains='0 to 100')
          script('linux/check-disk.sh','--warn','100','--inodes',contains='OK')
          r=script('linux/check-disk.sh','--warn','100','--quiet');assert not r.stdout
          script('linux/check-disk.sh','--warn','0',code=1,contains='threshold check')
          script('linux/check-disk.sh','--warn','008','--exclude','[',code=2,contains='invalid regex')
          script('linux/check-disk.sh','--exclude','.*',code=2,contains='no eligible')
          P('/tmp/faildf').mkdir(exist_ok=True)
          P('/tmp/faildf/df').write_text('#!/bin/sh\necho forced-df-failure >&2\nexit 7\n');P('/tmp/faildf/df').chmod(0o755)
          env=dict(os.environ,PATH='/tmp/faildf:'+os.environ['PATH'])
          script('linux/check-disk.sh',code=2,contains='health is unknown',env=env)

          check('test group',['groupadd','labteam'])
          P('staff.csv').write_bytes(b'\xef\xbb\xbfusername,full name,groups\r\nlabalice,"Alice, Example",labteam\r\nlabbob,Bob Example,\r\n')
          script('linux/bulk-create-users.sh','--file','staff.csv',contains='2 would be created')
          check('dry run did not create Alice',['id','labalice'],code=1)
          P('invalid.csv').write_text('labinvalid,Invalid,missinggroup\n')
          script('linux/bulk-create-users.sh','--file','invalid.csv','--apply',code=2,contains='does not exist')
          check('invalid group did not create user',['id','labinvalid'],code=1)
          P('invalid.csv').write_text('labalice,One,\nlabalice,Two,\n')
          script('linux/bulk-create-users.sh','--file','invalid.csv',code=2,contains='duplicate')
          P('invalid.csv').write_text('labalice,"Bad name,\n')
          script('linux/bulk-create-users.sh','--file','invalid.csv',code=2,contains='CSV validation failed')
          script('linux/bulk-create-users.sh','--file','staff.csv','--apply','--out','/missing-parent/passwords.csv',code=2,contains='no accounts changed')
          check('bad output did not create user',['id','labalice'],code=1)
          r=script('linux/bulk-create-users.sh','--file','staff.csv','--apply','--out',str(root/'passwords.csv'),contains='2 created')
          print('CREATE OUTPUT:\n'+r.stdout+r.stderr)
          assert pwd.getpwnam('labalice').pw_uid>=1000
          assert pwd.getpwnam('labalice').pw_gecos=='Alice, Example'
          assert stat.S_IMODE(P('passwords.csv').stat().st_mode)==0o600
          assert len(P('passwords.csv').read_text().splitlines())==3
          check('supplementary group',['id','labalice'],contains='labteam')
          shadow=subprocess.check_output(['getent','shadow','labalice'],text=True).split(':');assert shadow[2]=='0' and shadow[1] not in ('!','*','')
          script('linux/bulk-create-users.sh','--file','staff.csv','--apply','--out',str(root/'passwords.csv'),contains='2 skipped')
          P('other.csv').write_text('labother,Other,\n')
          script('linux/bulk-create-users.sh','--file','other.csv','--apply','--out',str(root/'passwords.csv'),code=2,contains='already exists')
          check('existing output prevented create',['id','labother'],code=1)
          script('linux/bulk-create-users.sh','--file','other.csv','--apply','--out',str(root/'otherpass.csv'),'--no-expire')
          assert subprocess.check_output(['getent','shadow','labother'],text=True).split(':')[2]!='0'

          script('linux/bulk-delete-users.sh','--min-uid','0','root','--apply','--yes',code=2,contains='cannot be below')
          script('linux/bulk-delete-users.sh','root','nobody','--apply','--yes',code=1,contains='protected account')
          check('system user',['useradd','--uid','999','labsystem'])
          script('linux/bulk-delete-users.sh','labsystem','--apply','--yes',code=1,contains='below minimum')
          check('system user survived',['id','labsystem'])
          P('leavers.txt').write_bytes(b'# comment\r\nlabalice\r\nlabbob\r\nlabalice')
          script('linux/bulk-delete-users.sh','--file','leavers.txt',contains='Total: 2 user(s)')
          check('delete dry run kept user',['id','labalice'])
          P('/home/labalice/proof.txt').write_text('preserve me')
          r=script('linux/bulk-delete-users.sh','labalice','--apply','--yes','--remove-home',contains='1 deleted, 0 failed')
          print('DELETE OUTPUT:\n'+r.stdout+r.stderr)
          check('Alice deleted',['id','labalice'],code=1);assert not P('/home/labalice').exists()
          archive=next(P('/var/backups/deleted-users').glob('labalice-*.tar.gz'))
          with tarfile.open(archive) as t: assert t.extractfile('labalice/proof.txt').read()==b'preserve me'
          assert list(P('/var/backups/deleted-users').glob('accounts-*/shadow'))
          script('linux/bulk-delete-users.sh','labbob','--apply','--yes',contains='home kept')
          assert P('/home/labbob').exists()
          check('dangerous home account',['useradd','-M','-d','/home','labunsafe'])
          script('linux/bulk-delete-users.sh','labunsafe','--apply','--yes','--remove-home',code=1,contains='refusing system/shared home')
          check('unsafe user survived',['id','labunsafe'])
          check('root-owned home account',['useradd','-M','-d','/srv/root-owned','labowned'])
          P('/srv/root-owned').mkdir(parents=True,exist_ok=True)
          script('linux/bulk-delete-users.sh','labowned','--apply','--yes','--remove-home',code=1,contains='not owned')
          check('root-owned home user survived',['id','labowned'])
          check('backup failure account',['useradd','-m','labbackup'])
          P('/tmp/failtar').mkdir(exist_ok=True)
          P('/tmp/failtar/tar').write_text('#!/bin/sh\nexit 1\n');P('/tmp/failtar/tar').chmod(0o755)
          tarenv=dict(os.environ,PATH='/tmp/failtar:'+os.environ['PATH'])
          script('linux/bulk-delete-users.sh','labbackup','--apply','--yes','--remove-home',code=1,contains='backup failed',env=tarenv)
          check('backup failure kept account',['id','labbackup']);assert P('/home/labbackup').exists()
          script('proxmox/cluster-health.sh',code=2,contains='required command missing')

          # These are command fixtures, not a real Proxmox installation or cluster.
          mock=P('/tmp/mockpve');mock.mkdir(exist_ok=True)
          def cmd(name,body):
           p=mock/name;p.write_text('#!/bin/sh\n'+body+'\n');p.chmod(0o755)
          cmd('pveversion','echo pve-manager/test-fixture')
          cmd('pvecm','[ "$1" = status ] && echo "Quorate: Yes"; exit 0')
          cmd('systemctl','exit 0')
          cmd('pvesm','printf "Name Type Status Total Used Available %%\\nlocal dir active 100 10 90 10.00%%\\n"')
          cmd('qm','printf "VMID NAME STATUS MEM BOOTDISK PID\\n100 test running 1024 8 10\\n"')
          cmd('pct','printf "VMID STATUS LOCK NAME\\n101 running - test\\n"')
          env=dict(os.environ,PATH=str(mock)+':'+os.environ['PATH'])
          script('proxmox/cluster-health.sh','--warn','100',contains='All checks passed',env=env)
          r=script('proxmox/cluster-health.sh','--warn','100','--quiet',env=env);assert not r.stdout
          P('/etc/pve').mkdir(exist_ok=True);P('/etc/pve/corosync.conf').touch()
          script('proxmox/cluster-health.sh','--warn','100',contains='cluster is quorate',env=env)
          cmd('pvecm','echo forced-cluster-error >&2; exit 1')
          r=script('proxmox/cluster-health.sh','--warn','100','--quiet',code=1,contains='configured cluster',env=env)
          print('PROXMOX SIMULATED FAILURE OUTPUT:\n'+r.stdout+r.stderr)
          P('/etc/pve/corosync.conf').unlink()
          cmd('pvesm','exit 1')
          script('proxmox/cluster-health.sh','--warn','100','--quiet',code=1,contains='storage health is unknown',env=env)
          cmd('pvesm','printf "Name Type Status Total Used Available %%\\nlocal dir active 100 10 90 10.00%%\\n"')
          cmd('qm','exit 1')
          script('proxmox/cluster-health.sh','--warn','100','--quiet',code=1,contains='qm list failed',env=env)
          # Exercise a real terminal, not piped input, for the beginner menu.
          import pty, select, time, re
          menu_script=str(root/'linux/bulk-delete-users.sh')
          def menu_run(label, steps, code=0, env=None, path=menu_script, direct=False):
              global passed
              master, slave=pty.openpty()
              proc=subprocess.Popen(([path] if direct else ['bash',path]),stdin=slave,stdout=slave,stderr=slave,env=env)
              os.close(slave)
              output=b''; position=0
              try:
                  for marker, answer in steps:
                      deadline=time.monotonic()+15
                      while marker.encode() not in output[position:]:
                          assert time.monotonic()<deadline,(label,output.decode(errors='replace'))
                          if select.select([master],[],[],.1)[0]:
                              try: chunk=os.read(master,65536)
                              except OSError: chunk=b''
                              assert chunk,(label,output.decode(errors='replace'))
                              output+=chunk
                      current=output[position:].decode(errors='replace')
                      position=len(output)
                      if callable(answer): answer=answer(current)
                      os.write(master,answer.encode())
                  deadline=time.monotonic()+15
                  while proc.poll() is None or select.select([master],[],[],.1)[0]:
                      assert time.monotonic()<deadline,(label,output.decode(errors='replace'))
                      if select.select([master],[],[],.1)[0]:
                          try: chunk=os.read(master,65536)
                          except OSError: break
                          if not chunk: break
                          output+=chunk
                  assert proc.wait(timeout=3)==code,(label,output.decode(errors='replace'))
              finally:
                  if proc.poll() is None: proc.kill();proc.wait()
                  os.close(master)
              passed+=1
              print('PASS',label,'exit='+str(code))
              return output.decode()

          def choose(name):
              def pick(text):
                  match=re.search(r'(?m)^(\d+)\. '+re.escape(name)+r'  ',text)
                  assert match,(name,text)
                  return match[1]+'\n'
              return pick

          def flow(name,mode,confirmation):
              return [('เลือกหมายเลข:', '2\n'),('เลือกหมายเลขบัญชี',choose(name)),('เลือกวิธีจัดการ:',mode+'\n'),('เพื่อยืนยันการลบจริง',confirmation+'\n')]

          for name in ['menukeep','menuremove','menucancel','menuoperator','menuactive']:
              check('create '+name,['useradd','-m','-s','/bin/bash',name])
          P('/home/menuremove/proof.txt').write_text('menu backup proof')
          r=menu_run('menu exit',[('เลือกหมายเลข:','0\n')]);assert 'ไม่มีการเปลี่ยนแปลง' in r
          r=menu_run('invalid menu choice',[('เลือกหมายเลข:','x\n'),('เลือกหมายเลข:','0\n')]);assert 'กรุณาเลือก' in r
          menu_run('invalid account choice',[('เลือกหมายเลข:','2\n'),('เลือกหมายเลขบัญชี','999999\n'),('เลือกหมายเลข:','0\n')])
          menu_run('cancel action',[('เลือกหมายเลข:','2\n'),('เลือกหมายเลขบัญชี',choose('menucancel')),('เลือกวิธีจัดการ:','0\n')])
          menu_run('wrong name cancels',flow('menucancel','1','wrongname'))
          menu_run('empty confirmation cancels',flow('menucancel','2',''))
          assert pwd.getpwnam('menucancel') and P('/home/menucancel').exists()
          # A controlled who fixture verifies that logged-in users are excluded.
          P('/tmp/menuwho').mkdir(exist_ok=True)
          P('/tmp/menuwho/who').write_text('#!/bin/sh\necho "menuactive pts/0 2026-10-20 12:00"\n');P('/tmp/menuwho/who').chmod(0o755)
          menv=dict(os.environ,SUDO_UID=str(pwd.getpwnam('menuoperator').pw_uid),PATH='/tmp/menuwho:'+os.environ['PATH'])
          r=menu_run('protected operator and active users hidden',[('เลือกหมายเลข:','1\n'),('เลือกหมายเลข:','0\n')],env=menv)
          assert not re.search(r'(?m)^\d+\. (root|nobody|labsystem|menuoperator|menuactive)  ',r)
          r=menu_run('menu delete keep home',flow('menukeep','1','menukeep'))
          assert 'DRY-RUN' in r and 'ดำเนินการสำเร็จ' in r and P('/home/menukeep').exists()
          check('menu keep account deleted',['id','menukeep'],code=1)
          r=menu_run('menu delete remove home',flow('menuremove','2','menuremove'))
          print('THAI MENU REAL OUTPUT:\n'+r)
          assert not P('/home/menuremove').exists()
          check('menu remove account deleted',['id','menuremove'],code=1)
          archive=next(P('/var/backups/deleted-users').glob('menuremove-*.tar.gz'))
          with tarfile.open(archive) as t: assert t.extractfile('menuremove/proof.txt').read()==b'menu backup proof'
          menu_run('renamed script menu',[('เลือกหมายเลข:','0\n')],path='/tmp/test.sh')
          script('linux/bulk-delete-users.sh','--menu',code=2,contains='Terminal')
          menu_run('terminal EOF cancels',[('เลือกหมายเลข:','\x04')])
          P('/tmp/test.sh').chmod(0o700)
          menu_run('chmod then direct execution',[('เลือกหมายเลข:','0\n')],path='/tmp/test.sh',direct=True)
          script('linux/bulk-delete-users.sh','--menu','--apply',code=2,contains='unknown option')
          create_menu=str(root/'linux/bulk-create-users.sh')
          disk_menu=str(root/'linux/check-disk.sh')
          pve_menu=str(root/'proxmox/cluster-health.sh')
          for path in [create_menu,disk_menu,pve_menu]:
              menu_run('menu exit '+path,[('เลือกหมายเลข:','0\n')],path=path)
              menu_run('menu EOF '+path,[('เลือกหมายเลข:','\x04')],path=path)
              menu_run('invalid menu '+path,[('เลือกหมายเลข:','bad\n'),('เลือกหมายเลข:','0\n')],path=path)
              check('reject non-terminal menu '+path,['bash',path,'--menu'],code=2,contains='Terminal')
          def create_flow(name,confirm='สร้าง',output='/tmp/menu-new-passwords.txt'):
              return [('เลือกหมายเลข:','1\n'),('ชื่อบัญชีใหม่',name+'\n'),('ชื่อแสดงผล','สมชาย, ทดสอบ\n'),('กลุ่มเสริม คั่น','labteam\n'),('ไฟล์ใหม่สำหรับ',output+'\n'),('เพื่อยืนยันสร้างจริง',confirm+'\n')]
          menu_run('creation cancelled',create_flow('menunewcancel',''),path=create_menu)
          check('cancel created no account',['id','menunewcancel'],code=1)
          r=menu_run('single user Thai menu',create_flow('menunew'),path=create_menu)
          print('CREATE MENU OUTPUT:\n'+r)
          assert pwd.getpwnam('menunew').pw_gecos=='สมชาย, ทดสอบ'
          assert stat.S_IMODE(P('/tmp/menu-new-passwords.txt').stat().st_mode)==0o600
          assert subprocess.check_output(['getent','shadow','menunew'],text=True).split(':')[2]=='0'
          menu_run('existing output refused',create_flow('menuoutblocked'),path=create_menu,code=2)
          check('existing output kept account absent',['id','menuoutblocked'],code=1)
          menu_run('invalid username rejected',[('เลือกหมายเลข:','1\n'),('ชื่อบัญชีใหม่','Bad User\n'),('ชื่อแสดงผล','Bad\n'),('กลุ่มเสริม คั่น','\n')],path=create_menu,code=2)
          menu_run('missing CSV rejected',[('เลือกหมายเลข:','2\n'),('เส้นทางไฟล์ CSV','/missing/menu.csv\n')],path=create_menu,code=2)
          P('/tmp/menu staff.csv').write_text('menucsv,CSV Name,\n')
          menu_run('CSV menu create',[('เลือกหมายเลข:','2\n'),('เส้นทางไฟล์ CSV','/tmp/menu staff.csv\n'),('ไฟล์ใหม่สำหรับ','/tmp/menu-csv-passwords.txt\n'),('เพื่อยืนยันสร้างจริง','สร้าง\n')],path=create_menu)
          assert pwd.getpwnam('menucsv')
          r=menu_run('disk menu healthy',[('เลือกหมายเลข:','2\n'),('กี่เปอร์เซ็นต์','100\n')],path=disk_menu);assert 'ผลตรวจ: ปกติ' in r
          r=menu_run('disk menu alert',[('เลือกหมายเลข:','1\n'),('กี่เปอร์เซ็นต์','0\n')],path=disk_menu,code=1);assert 'แจ้งเตือน' in r
          menu_run('disk invalid threshold retry',[('เลือกหมายเลข:','1\n'),('กี่เปอร์เซ็นต์','101\n'),('กี่เปอร์เซ็นต์','abc\n'),('กี่เปอร์เซ็นต์','100\n')],path=disk_menu)
          r=menu_run('disk failed collection',[('เลือกหมายเลข:','1\n'),('กี่เปอร์เซ็นต์','100\n')],path=disk_menu,code=2,env=dict(os.environ,PATH='/tmp/faildf:'+os.environ['PATH']));assert 'ไม่สามารถตรวจได้' in r
          menu_run('Proxmox unsupported host',[('เลือกหมายเลข:','1\n'),('กี่เปอร์เซ็นต์','100\n')],path=pve_menu,code=2)
          cmd('qm','printf "VMID NAME STATUS MEM BOOTDISK PID\\n100 test running 1024 8 10\\n"')
          menu_run('Proxmox menu healthy fixture',[('เลือกหมายเลข:','1\n'),('กี่เปอร์เซ็นต์','100\n')],path=pve_menu,env=env)
          cmd('qm','exit 1')
          r=menu_run('Proxmox menu failed fixture',[('เลือกหมายเลข:','2\n'),('กี่เปอร์เซ็นต์','100\n')],path=pve_menu,env=env,code=1)
          assert 'แจ้งเตือน' in r and 'qm list failed' in r
          print('PROXMOX MENU FIXTURE OUTPUT:\n'+r)
          info=str(root/'linux/system-info.sh')
          script('linux/system-info.sh','--help',contains='Exit codes:')
          script('linux/system-info.sh','--bad',code=2,contains='unknown option')
          script('linux/system-info.sh','--all','--disk',code=2,contains='one option')
          script('linux/system-info.sh','--menu',code=2,contains='Terminal')
          for option in ['--all','--system','--memory','--disk']:
              r=script('linux/system-info.sh',option,contains='อ่านข้อมูลเสร็จ')
              if option=='--all': print('SYSTEM INFO REAL OUTPUT:\n'+r.stdout)
          for selection in ['1','2','3','4']:
              menu_run('system info menu '+selection,[('เลือกหมายเลข:',selection+'\n')],path=info)
          menu_run('system info menu cancel',[('เลือกหมายเลข:','0\n')],path=info)
          menu_run('system info invalid choice',[('เลือกหมายเลข:','x\n'),('เลือกหมายเลข:','0\n')],path=info)
          menu_run('system info EOF',[('เลือกหมายเลข:','\x04')],path=info)
          script('linux/system-info.sh','--disk',code=1,contains='รายงานไม่ครบ',env=dict(os.environ,PATH='/tmp/faildf:'+os.environ['PATH']))
          P('/tmp/info-renamed.sh').write_text(P(info).read_text());P('/tmp/info-renamed.sh').chmod(0o755)
          check('system info unprivileged',['runuser','-u','nobody','--','/tmp/info-renamed.sh','--all'],contains='อ่านข้อมูลเสร็จ')
          menu_run('system info renamed direct',[('เลือกหมายเลข:','0\n')],path='/tmp/info-renamed.sh',direct=True)
          print('TOTAL:',passed,'checks passed; real Linux account operations, Proxmox command fixtures only.')
          PY
